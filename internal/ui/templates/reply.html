{{define "reply"}}
<div class="form-pane">
  <div class="form-title">reply</div>
  <form hx-post="/ui/reply" hx-target="#reading-pane" hx-swap="innerHTML" hx-encoding="multipart/form-data">
    <input type="hidden" name="id" value="{{.ReplyToID}}"/>
    <div class="form-field">
      <label class="form-label">to</label>
      <input class="form-input" name="to" type="text" required value="{{.To}}" autocomplete="off"/>
    </div>
    <details class="cc-toggle" {{if .CC}}open{{end}} style="margin-bottom:12px">
      <summary>+ cc / bcc</summary>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
        <div class="form-field" style="margin:0">
          <label class="form-label">cc</label>
          <input class="form-input" name="cc" type="text" value="{{.CC}}" placeholder="addr1@example.com, addr2@example.com"/>
        </div>
        <div class="form-field" style="margin:0">
          <label class="form-label">bcc</label>
          <input class="form-input" name="bcc" type="text" placeholder="addr1@example.com, addr2@example.com"/>
        </div>
      </div>
    </details>
    <div class="form-field">
      <label class="form-label">subject</label>
      <input class="form-input" name="subject" type="text" value="{{.Subject}}"/>
    </div>
    <div class="form-field">
      <label class="form-label">body</label>
      <textarea class="form-input" name="body" rows="10">{{.QuotedBody}}</textarea>
    </div>
    <div class="form-field">
      <label class="form-label">attachments</label>
      <input class="form-input form-input--file" name="attachments" type="file" multiple/>
    </div>
    <button class="act-p" type="submit">send reply</button>
  </form>
</div>
{{end}}
