{{define "reply"}}
<div class="form-pane">
  <div class="form-title">reply</div>
  <form hx-post="/ui/reply" hx-target="#reading-pane" hx-swap="innerHTML">
    <input type="hidden" name="id" value="{{.ReplyToID}}"/>
    <div class="form-field">
      <label class="form-label">to</label>
      <input class="form-input" name="to" type="email" required value="{{.To}}"/>
    </div>
    {{template "cc_bcc" .}}
    <div class="form-field">
      <label class="form-label">subject</label>
      <input class="form-input" name="subject" type="text" value="{{.Subject}}"/>
    </div>
    <div class="form-field">
      <label class="form-label">body</label>
      <textarea class="form-input" name="body" rows="14">{{.QuotedBody}}</textarea>
    </div>
    <button class="act-p" type="submit">send reply</button>
  </form>
</div>
{{end}}
