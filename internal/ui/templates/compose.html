{{define "compose"}}
<div class="form-pane">
  <div class="form-title">{{if .Title}}{{.Title}}{{else}}compose{{end}}</div>
  {{if .Error}}<p class="status-detail" role="alert">{{.Error}}</p>{{end}}
  <form hx-post="/ui/compose" hx-target="#reading-pane" hx-swap="innerHTML" hx-encoding="multipart/form-data">
    <div class="form-field">
      <label class="form-label" for="recipient-to">to</label>
      <input class="form-input" id="recipient-to" name="to" type="text" data-contact-input autocapitalize="none" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="contacts-recipient-to" autocomplete="off" required value="{{.To}}" placeholder="recipient@example.com, another@example.com"/>
    </div>
    <details class="cc-toggle" {{if or .CC .BCC}}open{{end}} style="margin-bottom:12px">
      <summary>+ cc / bcc</summary>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
        <div class="form-field" style="margin:0">
          <label class="form-label" for="recipient-cc">cc</label>
          <input class="form-input" id="recipient-cc" name="cc" type="text" data-contact-input autocapitalize="none" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="contacts-recipient-cc" autocomplete="off" value="{{.CC}}" placeholder="addr1@example.com, addr2@example.com"/>
        </div>
        <div class="form-field" style="margin:0">
          <label class="form-label" for="recipient-bcc">bcc</label>
          <input class="form-input" id="recipient-bcc" name="bcc" type="text" data-contact-input autocapitalize="none" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="contacts-recipient-bcc" autocomplete="off" value="{{.BCC}}" placeholder="addr1@example.com, addr2@example.com"/>
        </div>
      </div>
    </details>
    <div class="form-field">
      <label class="form-label" for="draft-subject">subject</label>
      <input class="form-input" id="draft-subject" name="subject" type="text" value="{{.Subject}}" placeholder="subject"/>
    </div>
    <div class="form-field">
      <label class="form-label" for="draft-body">body</label>
      <textarea class="form-input" id="draft-body" name="body" rows="12">{{.Body}}</textarea>
    </div>
    <div class="form-field">
      <label class="form-label" for="draft-attachments">attachments</label>
      <p class="status-detail">Total encoded message limit: 25 MiB, including attachments and headers.</p>
      <input class="form-input form-input--file" id="draft-attachments" name="attachments" type="file" multiple/>
    </div>
    <button class="act-p" type="submit">send</button>
  </form>
</div>
{{end}}
