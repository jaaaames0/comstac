{{define "message_list_more"}}
{{range .Items}}
<div id="row-{{.ID}}" class="msg-row {{if not .Read}}msg-row--unread{{end}}"
     hx-get="/ui/message?id={{.ID}}"
     hx-target="#reading-pane"
     hx-swap="innerHTML">

  <div class="msg-row-top">
    <span class="msg-sender">{{fmtSender .FromAddr}}</span>
    <div class="msg-row-meta">
      {{if $.ShowSource}}<span class="badge badge-src">{{.Source}}</span>{{end}}
      <span class="msg-time">{{fmtTime .SentAt}}</span>
    </div>
  </div>

  <div class="msg-row-bottom">
    {{if .Spam}}<span class="badge badge-spam">spam</span>{{end}}
    {{if .SnoozeUntil}}<span class="badge badge-snoozed">snoozed</span>{{end}}
    <span class="msg-subject">{{.Subject}}</span>
  </div>

  <div class="row-acts">
    <button class="ra{{if not .Archived}} ra--trash{{end}}"
            onclick="event.stopPropagation()"
            hx-post="/ui/message/actions"
            hx-target="#reading-pane"
            hx-swap="innerHTML"
            hx-vals='{"id":"{{.ID}}","action":"archive","value":"{{if .Archived}}0{{else}}1{{end}}"}'>
      {{if .Archived}}restore{{else}}trash{{end}}
    </button>
  </div>

</div>
{{end}}
{{if .MoreURL}}
<div id="msg-more-sentinel"
     hx-get="{{.MoreURL}}&append=1"
     hx-target="this"
     hx-swap="outerHTML"
     hx-trigger="revealed"></div>
{{else}}
<div class="list-end">— end —</div>
{{end}}
{{end}}
