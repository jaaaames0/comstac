{{define "send_success"}}
<div class="status-card">
  <div class="status-icon">✓</div>
  <div class="status-title status-title--ok">message sent</div>
  <div class="status-detail">to: {{.To}}</div>
  <div class="status-detail">{{.Subject}}</div>
  {{if .Warning}}<div class="status-detail" role="status">{{.Warning}}</div>{{end}}
</div>
{{end}}
