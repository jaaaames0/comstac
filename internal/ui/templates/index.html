{{define "index"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#0d1117"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/png" href="/static/icon-192.png"/>
  <link rel="apple-touch-icon" href="/static/icon-192.png"/>
  <title>comstac</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    /* ── Reset & tokens ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface-2:    #1c2128;
      --surface-3:    #21262d;
      --border:       #30363d;
      --border-sub:   #21262d;
      --text:         #e6edf3;
      --muted:        #8b949e;
      --dim:          #484f58;
      --accent:       #34d399;
      --accent-dim:   rgba(52,211,153,.10);
      --accent-ring:  rgba(52,211,153,.25);
      --danger:       #f85149;
      --danger-dim:   rgba(248,81,73,.10);
      --warning:      #e3b341;
      --mono: ui-monospace,'Cascadia Code','JetBrains Mono','Fira Code',monospace;
      --topbar: 44px;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--mono);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Top command bar ─────────────────────────────────────────── */
    .topbar {
      height: var(--topbar);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .06em;
      margin-right: 12px;
      flex-shrink: 0;
      user-select: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .back-btn { display: none; }

    .filter-nav {
      display: flex;
      align-items: center;
      gap: 1px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-nav::-webkit-scrollbar { display: none; }

    .f {
      padding: 5px 9px;
      border: none;
      background: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      white-space: nowrap;
      transition: color .12s, background .12s;
      line-height: 1;
    }
    .f:hover { color: var(--text); background: var(--surface-2); }
    .f.active { color: var(--accent); background: var(--accent-dim); }
    .f--warn { color: var(--danger) !important; }

    .sep {
      width: 1px;
      height: 14px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 4px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .search-form { display: flex; align-items: center; }
    .search-input {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 3px;
      width: 150px;
      outline: none;
      transition: border-color .15s, width .2s;
    }
    .search-input:focus { border-color: var(--accent-ring); width: 190px; }
    .search-input::placeholder { color: var(--dim); }

    .compose-btn {
      padding: 5px 11px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-ring);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s;
    }
    .compose-btn:hover { background: rgba(52,211,153,.17); }

    /* ── Workspace ───────────────────────────────────────────────── */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 2fr;
      height: calc(100vh - var(--topbar));
      margin-top: var(--topbar);
    }

    .list-col {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--bg);
    }

    .reader-col {
      overflow: hidden;
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }

    #reading-pane {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ── Message list rows ───────────────────────────────────────── */
    #message-list { min-height: 100%; }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-sub);
      cursor: pointer;
      position: relative;
      transition: background .1s;
      border-left: 2px solid transparent;
    }
    .msg-row:hover { background: var(--surface-2); }
    .msg-row.selected {
      background: var(--accent-dim);
      border-left-color: var(--accent);
    }

    .msg-row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .msg-sender {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      flex-shrink: 0;
      max-width: 55%;
    }

    .msg-subject {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--dim);
    }

    /* unread: bright + bold */
    .msg-row--unread .msg-sender { color: var(--text); font-weight: 600; }
    .msg-row--unread .msg-subject { color: var(--muted); }

    .msg-row-bottom {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .msg-row-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .msg-time {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      transition: opacity .12s;
    }

    /* hover-reveal inline actions */
    .row-acts {
      position: absolute;
      right: 10px;
      bottom: 8px;
      display: flex;
      gap: 0;
      align-items: stretch;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .msg-row:hover .row-acts  { opacity: 1; pointer-events: auto; }
    .msg-row:hover .msg-time  { opacity: 0; }
    @media (max-width: 680px) { .row-acts { display: none; } }

    .ra {
      padding: 5px 10px;
      border: none;
      background: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      transition: color .1s, background .1s;
      line-height: 1;
    }
    .ra:hover { color: var(--text); background: var(--surface-2); }
    .ra--trash:hover { color: var(--danger); background: var(--danger-dim); }

    .badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 2px;
      font-weight: 600;
      letter-spacing: .03em;
      white-space: nowrap;
    }
    .badge-spam   { background: var(--danger-dim); color: var(--danger); }
    .badge-src    { background: var(--surface-3);  color: var(--dim); border: 1px solid var(--border); }
    .badge-snoozed { background: rgba(227,179,65,.1); color: var(--warning); }

    .list-empty {
      padding: 48px 20px;
      text-align: center;
      color: var(--dim);
      font-size: 12px;
    }

    .list-end {
      padding: 10px;
      text-align: center;
      border-top: 1px solid var(--border-sub);
      color: var(--dim);
      font-size: 11px;
    }

    .trash-footer {
      padding: 10px 12px;
      font-size: 11px;
      color: var(--dim);
      border-top: 1px solid var(--border-sub);
    }
    .trash-footer-link {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--border);
      padding: 0;
      transition: color .12s;
    }
    .trash-footer-link:hover { color: var(--text); }

    /* ── Reading pane ────────────────────────────────────────────── */
    .reader-empty {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .msg-header {
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .msg-subject-line {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .msg-fields {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 3px 8px;
      font-size: 12px;
      margin-bottom: 14px;
      color: var(--muted);
    }
    .mf-label { color: var(--dim); }

    .auth-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .auth-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 600;
      font-family: var(--mono);
      letter-spacing: .03em;
    }
    .auth-pass    { background: var(--accent-dim);  color: var(--accent);  border: 1px solid var(--accent-ring); }
    .auth-fail    { background: var(--danger-dim);  color: var(--danger);  border: 1px solid rgba(248,81,73,.2); }
    .auth-neutral { background: var(--surface-3);   color: var(--muted);   border: 1px solid var(--border); }

    .spam-banner {
      padding: 6px 10px;
      background: var(--danger-dim);
      border: 1px solid rgba(248,81,73,.2);
      border-radius: 3px;
      font-size: 11px;
      color: var(--danger);
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: .03em;
    }

    .snooze-banner {
      padding: 6px 10px;
      background: rgba(227,179,65,.08);
      border: 1px solid rgba(227,179,65,.2);
      border-radius: 3px;
      font-size: 11px;
      color: var(--warning);
      margin-bottom: 12px;
    }

    .msg-acts {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* primary action */
    .act-p {
      padding: 5px 12px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-ring);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: background .12s;
    }
    .act-p:hover { background: rgba(52,211,153,.18); }

    /* secondary action */
    .act-s {
      padding: 5px 10px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: color .12s, border-color .12s;
    }
    .act-s:hover { color: var(--text); border-color: var(--dim); }

    /* danger action (spam) */
    .act-d {
      padding: 5px 10px;
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--mono);
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: color .12s, border-color .12s;
    }
    .act-d:hover { color: var(--danger); border-color: rgba(248,81,73,.3); }

    /* trash button — red accent, rightmost */
    .act-trash {
      padding: 5px 10px;
      background: var(--danger-dim);
      border: 1px solid rgba(248,81,73,.2);
      color: var(--danger);
      font-family: var(--mono);
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
      margin-left: auto;
    }
    .act-trash:hover { background: rgba(248,81,73,.18); border-color: rgba(248,81,73,.4); }

    /* ── Attachments ─────────────────────────────────────────────── */
    .attachments {
      margin: 0 24px 16px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 3px;
      flex-shrink: 0;
    }
    .att-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--dim);
      margin-bottom: 8px;
    }
    .att-link {
      display: block;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      padding: 2px 0;
    }
    .att-link:hover { text-decoration: underline; }
    .att-type { color: var(--dim); font-size: 11px; }

    /* ── Message body ────────────────────────────────────────────── */
    /* Wrapper makes msg-header + body fill the reader as a flex column */
    .msg-detail-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Plain-text body: padded and scrolls within the pane */
    .msg-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px;
    }

    /* HTML body: iframe fills edge-to-edge, no outer padding or scroll */
    .msg-body--html {
      padding: 0;
      overflow: hidden;
    }

    .body-text {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .body-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    /* ── Compose / Reply ─────────────────────────────────────────── */
    .form-pane { padding: 22px 24px; }

    .form-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
    }

    .form-field { margin-bottom: 12px; }

    .form-label {
      display: block;
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 4px;
      letter-spacing: .04em;
    }

    .form-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 7px 10px;
      border-radius: 3px;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--accent-ring); }
    .form-input::placeholder { color: var(--dim); }

    textarea.form-input {
      resize: vertical;
      line-height: 1.55;
      min-height: 220px;
    }

    details.cc-toggle summary {
      font-size: 11px;
      color: var(--dim);
      cursor: pointer;
      user-select: none;
      list-style: none;
      margin-bottom: 8px;
      transition: color .12s;
    }
    details.cc-toggle summary::-webkit-details-marker { display: none; }
    details.cc-toggle summary:hover { color: var(--muted); }
    details.cc-toggle[open] summary { color: var(--muted); }

    /* ── Accounts table ──────────────────────────────────────────── */
    .acc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .acc-table th {
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .acc-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-sub);
      color: var(--muted);
    }

    /* ── Status cards ────────────────────────────────────────────── */
    .status-card {
      padding: 48px 24px;
      text-align: center;
    }
    .status-icon { font-size: 26px; margin-bottom: 10px; }
    .status-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .status-title--ok  { color: var(--accent); }
    .status-title--err { color: var(--danger); }
    .status-detail { font-size: 12px; color: var(--muted); }

    /* ── Scrollbars ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

    /* ── Back button (mobile only, hidden by default) ────────────── */
    /* ── Mobile — portrait push pattern ─────────────────────────── */
    @media (max-width: 680px) {
      /* ── Two-row topbar ─────────────────────────────────────────── */
      :root { --topbar: 80px; }

      .topbar { flex-wrap: wrap; height: auto; padding: 0; gap: 0; }

      /* Row 1: brand (left) + actions (right) */
      .brand        { order: 0; height: 40px; padding: 0 12px; margin-right: 0; }
      .topbar-right { order: 1; height: 40px; margin-left: auto; padding-right: 10px;
                      display: flex; align-items: center; gap: 6px; }
      .search-input  { width: 100px; }
      .compose-label { display: inline; }

      /* Row 2: filter nav full-width */
      .filter-nav { order: 2; flex: 0 0 100%; height: 40px;
                    padding: 0 6px; gap: 0;
                    border-top: 1px solid var(--border-sub); }

      /* ── Single-column workspace ─────────────────────────────────── */
      .workspace {
        grid-template-columns: 1fr;
        height: calc(100dvh - var(--topbar));
      }

      /* Reader overlay — slides in from right; base flex styles already set */
      .reader-col {
        position: fixed;
        top: var(--topbar);
        left: 0;
        width: 100%;
        height: calc(100dvh - var(--topbar));
        z-index: 15;
        transform: translateX(100%);
        transition: transform 200ms ease;
      }
      body.detail-open .reader-col { transform: translateX(0); }

      /* ── Email iframe: allow horizontal scroll within the iframe on mobile ── */
      .msg-body--html { overflow-x: auto; }
      .body-iframe { overflow-x: auto; }

      /* ── Action buttons: single scrollable row ───────────────────── */
      .msg-acts {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 4px;
        padding-bottom: 2px;
      }
      .msg-acts::-webkit-scrollbar { display: none; }
      .act-p, .act-s, .act-d, .act-trash {
        padding: 4px 8px;
        font-size: 11px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* ── Back button replaces brand name when detail is open ────── */
      .brand-name { display: flex; align-items: center; }
      .back-btn {
        display: none;
        align-items: center;
        gap: 4px;
        background: none;
        border: none;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .04em;
        cursor: pointer;
        padding: 0;
        white-space: nowrap;
        transition: color .12s;
      }
      body.detail-open .back-btn { display: flex; }
      body.detail-open .brand-name { display: none; }
      .back-btn:hover { color: var(--text); }
    }
  </style>
</head>
<body hx-headers='{"X-CSRF-Token":"{{.CSRFToken}}"}'>

  <header class="topbar">
    <span class="brand" id="brand-btn">
      <button class="back-btn" id="back-btn">← back</button>
      <span class="brand-name">comstac</span>
    </span>

    <nav class="filter-nav" id="filter-nav">
      <!-- Filter dimension: inbox / trash / spam -->
      <button class="f active" data-filter="inbox">inbox</button>
      <button class="f"        data-filter="trash">trash</button>
      <button class="f"        data-filter="spam">spam</button>
      <span class="sep"></span>
      <!-- Stream dimension: all / smtp / imap -->
      <button class="f active" data-stream="all" title="all mail">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" style="display:block"><path fill-rule="evenodd" d="M0 3.5A.5.5 0 0 1 .5 3H1c2.202 0 3.827 1.24 4.874 2.418.49.552.865 1.102 1.126 1.532.26-.43.636-.98 1.126-1.532C9.173 4.24 10.798 3 13 3v1c-1.798 0-3.173 1.01-4.126 2.082A9.624 9.624 0 0 0 7.556 8a9.624 9.624 0 0 0 1.317 1.918C9.828 10.99 11.204 12 13 12v1c-2.202 0-3.827-1.24-4.874-2.418A10.595 10.595 0 0 1 7 9.05c-.26.43-.636.98-1.126 1.532C4.827 11.76 3.202 13 1 13H.5a.5.5 0 0 1 0-1H1c1.798 0 3.173-1.01 4.126-2.082A9.624 9.624 0 0 0 6.444 8a9.624 9.624 0 0 0-1.317-1.918C4.172 5.01 2.796 4 1 4H.5a.5.5 0 0 1-.5-.5z"/><path d="M13 5.466V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192zm0 9v-3.932a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192z"/></svg>
      </button>
      <button class="f" data-stream="smtp">smtp</button>
      <button class="f" data-stream="imap">imap</button>
      <!-- Standalone views -->
      <button class="f" id="sent-btn">sent</button>
      <span class="sep"></span>
      <button class="f{{if .IMAPAuthFailed}} f--warn{{end}}" hx-get="/ui/accounts" hx-target="#reading-pane" hx-swap="innerHTML">accounts{{if .IMAPAuthFailed}} ⚠{{end}}</button>
    </nav>

    <div class="topbar-right">
      <form class="search-form"
            hx-get="/ui/search"
            hx-target="#message-list"
            hx-swap="outerHTML"
            hx-trigger="submit">
        <input class="search-input" name="q" type="search" placeholder="search…" autocomplete="off"/>
      </form>

      <button class="compose-btn"
              hx-get="/ui/compose"
              hx-target="#reading-pane"
              hx-swap="innerHTML">+ <span class="compose-label">compose</span></button>

      <form method="post" action="/logout" style="display:inline">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}"/>
        <button class="act-s" type="submit" style="font-size:11px;padding:4px 9px">logout</button>
      </form>
    </div>
  </header>

  <div class="workspace">
    <div class="list-col">
      <div id="message-list" hx-get="/ui/messages?limit=50&spam=0&archived=0" hx-trigger="load"></div>
    </div>
    <div class="reader-col">
      <div id="reading-pane">
        <div class="reader-empty">select a message</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Clean up the ?n= cache-busting param added by the service worker
      // after a push notification click, so the URL doesn'tpersist ugliness.
      if (location.search.indexOf('n=') !== -1) {
        history.replaceState(null, '', location.pathname);
      }

      var workspace       = document.querySelector('.workspace');
      var listCol         = document.querySelector('.list-col');
      var pane            = document.getElementById('reading-pane');
      var activeMessageId = null; // numeric id string of currently shown message

      // ── Filter + stream state ─────────────────────────────────────
      var activeFilter = 'inbox';    // inbox | trash | spam
      var activeStream = 'all';      // all | smtp | imap
      var activePage   = 'messages'; // messages | sent

      function filterParams() {
        var p = 'limit=50';
        if (activeFilter === 'inbox') p += '&spam=0&archived=0';
        else if (activeFilter === 'trash') p += '&trash=1';
        else if (activeFilter === 'spam')  p += '&spam=1';
        if (activeStream === 'smtp') p += '&source=smtp';
        else if (activeStream === 'imap') p += '&source=imap';
        return p;
      }

      function closeDetail() {
        document.body.classList.remove('detail-open');
      }
      function openDetail() {
        document.body.classList.add('detail-open');
        window._detailOpen = true;
        history.pushState({detailOpen: true}, '');
      }

      // Intercept the system back button: close the detail pane instead of
      // navigating away. The suppressBack flag prevents an infinite loop when
      // history.back() is used to undo our pushState entry.
      var suppressBack = false;
      window.addEventListener('popstate', function(e) {
        if (suppressBack) { suppressBack = false; return; }
        if (window._detailOpen) {
          suppressBack = true;
          window._detailOpen = false;
          closeDetail();
          activeMessageId = null;
          history.back(); // undo the pushState, fires popstate again → suppressed
        }
      });

      function clearPane() {
        pane.innerHTML = '<div class="reader-empty">select a message</div>';
        closeDetail();
        activeMessageId = null;
      }

      function updateNavState() {
        document.querySelectorAll('[data-filter]').forEach(function(b) {
          b.classList.toggle('active', activePage === 'messages' && b.dataset.filter === activeFilter);
        });
        document.querySelectorAll('[data-stream]').forEach(function(b) {
          b.classList.toggle('active', activePage === 'messages' && b.dataset.stream === activeStream);
        });
        document.getElementById('sent-btn').classList.toggle('active', activePage === 'sent');
      }

      // Filter/stream change: reload list, then re-highlight the active row
      // (or clear the pane if the active message isn't in the new results).
      // Uses the Promise returned by htmx.ajax() — resolves after the swap
      // settles, so the new rows are guaranteed to be in the DOM.
      function loadMessages() {
        activePage = 'messages';
        updateNavState();
        // Capture the message ID that was active before the swap, so we can
        // re-apply the highlight regardless of what happens to activeMessageId
        // during the async load (e.g. concurrent row clicks).
        var savedId = activeMessageId;
        htmx.ajax('GET', '/ui/messages?' + filterParams(), {target: '#message-list', swap: 'outerHTML'}).then(function() {
          var row = savedId ? document.getElementById('row-' + savedId) : null;
          if (row) {
            row.classList.add('selected');
          } else {
            clearPane();
          }
        });
      }

      document.querySelectorAll('[data-filter]').forEach(function(b) {
        b.addEventListener('click', function() { activeFilter = this.dataset.filter; loadMessages(); });
      });
      document.querySelectorAll('[data-stream]').forEach(function(b) {
        b.addEventListener('click', function() { activeStream = this.dataset.stream; loadMessages(); });
      });

      // Sent — standalone, always clears pane
      document.getElementById('sent-btn').addEventListener('click', function() {
        activePage = 'sent';
        htmx.ajax('GET', '/ui/sent', {target: '#message-list', swap: 'outerHTML'});
        clearPane();
        updateNavState();
      });

      // Brand — home: reset filters to default inbox
      document.getElementById('brand-btn').addEventListener('click', function() {
        activeFilter = 'inbox'; activeStream = 'all'; activePage = 'messages';
        htmx.ajax('GET', '/ui/messages?' + filterParams(), {target: '#message-list', swap: 'outerHTML'});
        clearPane();
        updateNavState();
      });

      // Back button (mobile) — dismiss overlay without clearing the pane,
      // so re-opening the same message doesn't need a network round-trip.
      document.getElementById('back-btn').addEventListener('click', function(e) {
        e.stopPropagation(); // don't bubble to brand-btn click handler
        closeDetail();
        document.querySelectorAll('.msg-row.selected').forEach(function(r) { r.classList.remove('selected'); });
        activeMessageId = null; // prevent stale re-highlight on next filter change
      });

      // ── After pane content changes: open/close + sync row read state ──
      // Guard against bubbled events from child elements (e.g. auto-read hx-swap="none").
      pane.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail && e.detail.target !== pane) return;
        if (this.querySelector('.reader-empty')) {
          closeDetail();
          activeMessageId = null;
        } else {
          openDetail();
          var wrap = this.querySelector('.msg-detail-wrap');
          if (!wrap) {
            // Non-message content (compose, accounts)
            activeMessageId = null;
          } else {
            // Sync the list row's unread indicator with the detail's read state
            var msgId = wrap.dataset.id;
            var isRead = wrap.dataset.read === '1';
            var row = msgId ? document.getElementById('row-' + msgId) : null;
            if (row) {
              if (isRead) {
                row.classList.remove('msg-row--unread');
              } else {
                row.classList.add('msg-row--unread');
              }
            }
          }
        }
      });

      // ── Row click: track active message + mark read optimistically ──
      listCol.addEventListener('click', function(e) {
        var row = e.target.closest('.msg-row');
        if (!row) return;
        // Don't open message if they tapped the swipe action button
        if (e.target.closest('.ra')) return;
        document.querySelectorAll('.msg-row.selected').forEach(function(r) { r.classList.remove('selected'); });
        row.classList.add('selected');
        var msgId = row.id.replace('row-', '');
        activeMessageId = msgId;

        // Optimistically mark as read immediately (before detail pane loads)
        if (row.classList.contains('msg-row--unread')) {
          row.classList.remove('msg-row--unread');
          htmx.ajax('POST', '/ui/message/actions', {
            target: '#reading-pane',
            swap: 'innerHTML',
            values: {id: msgId, action: 'read', value: '1'}
          });
        }

        openDetail(); // immediate slide-in on mobile; no-op class-add on desktop
      });

      // ── Swipe to trash/restore on mobile ─────────────────────────
      var swipeState = null; // { row, startX, startY, moved }
      listCol.addEventListener('touchstart', function(e) {
        var row = e.target.closest('.msg-row');
        if (!row || e.target.closest('.ra')) return;
        swipeState = { row: row, startX: e.touches[0].clientX, startY: e.touches[0].clientY, moved: false };
      }, { passive: true });

      listCol.addEventListener('touchmove', function(e) {
        if (!swipeState) return;
        var dx = e.touches[0].clientX - swipeState.startX;
        var dy = e.touches[0].clientY - swipeState.startY;
        // If primarily vertical, cancel swipe tracking
        if (!swipeState.moved && Math.abs(dy) > Math.abs(dx)) { swipeState = null; return; }
        swipeState.moved = true;
        var pct = Math.min(Math.abs(dx) / 120, 1);
        swipeState.row.style.transform = 'translateX(' + dx + 'px)';
        swipeState.row.style.transition = 'none';
        swipeState.row.style.opacity = String(1 - pct * 0.5);
      }, { passive: true });

      listCol.addEventListener('touchend', function(e) {
        if (!swipeState || !swipeState.moved) { swipeState = null; return; }
        var row = swipeState.row;
        var dx = e.changedTouches[0].clientX - swipeState.startX;
        swipeState = null;
        row.style.transition = 'transform 200ms ease, opacity 200ms ease';
        if (Math.abs(dx) >= 80) {
          // Trigger the action button (trash or restore)
          var btn = row.querySelector('.ra');
          if (btn) {
            row.style.transform = (dx > 0 ? 'translateX(100%)' : 'translateX(-100%)');
            row.style.opacity = '0';
            btn.click();
            return;
          }
        }
        // Snap back
        row.style.transform = '';
        row.style.opacity = '';
      });
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
{{end}}
